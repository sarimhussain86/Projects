{% include 'header.html' %}
<body>
  <div class="container-fluid" id="main">
    <div class="row row-offcanvas row-offcanvas-left">      
      <div class="col-md-9 col-lg-10 main"> 
		<h2>User Login</h2>
		<form action="{{ url_for('login') }}" method="post">
			{% if message is defined and message %}
				<div class="alert alert-warning">{{ message }}</div>
			{% endif %}
			<div class="form-group">
				<label for="username">Username:</label>
				<input type="input" class="form-control" id="username" name="username" placeholder="Enter Username" name="username">
			</div>
			<div class="form-group">
				<label for="password">Password:</label>
				<input type="password" class="form-control" id="password" name="password" placeholder="Enter password" name="pswd">
			</div>    
			<button type="submit" class="btn btn-primary">Login</button>
		</form>
        
        <hr>         
       </div>       
      </div>     
    </div>
  </body>
</html>
